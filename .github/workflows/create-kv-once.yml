name: Create SESSIONS KV once
on:
  push:
    branches: [fix/sessions-kv-namespace]
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: cd api && bun install
      - name: List then create if absent
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler kv namespace list
          if npx wrangler kv namespace list | grep -q '"title": "product-engineer-SESSIONS"'; then
            echo "already exists; not creating"
          else
            npx wrangler kv namespace create SESSIONS
            npx wrangler kv namespace list
          fi
